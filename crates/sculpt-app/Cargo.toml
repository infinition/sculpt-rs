[package]
name = "sculpt-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
glam = { version = "0.33.3", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
pollster = "1.0.1"
rayon = "1.12.0"
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
sculpt-core = { version = "0.1.0", path = "../sculpt-core" }
wgpu = "30.0.0"
winit = "0.30.13"
